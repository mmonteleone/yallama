model=meta-models/Muse-Glimmer-30B-GGUF:Q4_K_M

--temp 1.0
--top-p 0.95

[mlx]
--max-tokens 8192

[mlx.serve]
--top-k 64
--min-p 0.0

[llama.cpp]
--top-k 64
--min-p 0.0
--repeat-penalty 1.0
--presence-penalty 0.0
--frequency-penalty 0.0
--gpu-layers all
--ctx-size 32768
--parallel 1
--flash-attn on
--cache-type-k q8_0
--cache-type-v q8_0
--batch-size 2048
--ubatch-size 512
--n-predict 8192
--reasoning auto

## Uncomment for DFlash drafting
# --spec-type draft-dflash
# --spec-draft-n-max 3

[llama.cpp.serve]
--cache-reuse 256
--cache-prompt
